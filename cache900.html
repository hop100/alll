<!DOCTYPE html>
<html lang="id" manifest="900.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANTAZIA</title>
<link rel="stylesheet" href="apache.css">
</head>
<body>

<script>
history.replaceState(null,null,'index.html');
var histlength=history.length;
history.go(-histlength);

function setMsg(htmlContent, type) {
    var msgsElem = document.getElementById("msgs");
    if(!msgsElem) return;
    
    msgsElem.className = ""; 
    if (type === "success") {
        msgsElem.classList.add("success");
    } else if (type === "error") {
        msgsElem.classList.add("error");
    }
    msgsElem.innerHTML = htmlContent;
}

function DLProgress(e){
    Percent = Math.round(e.loaded / e.total * 100);
    setMsg(" Cache Offline: " + Percent + "%", "running");
    
    var bar = document.getElementById("pbar");
    if (bar) {
        bar.style.width = Percent + "%";
    }
}

function DisplayCacheProgress(){
    setMsg("Cache LODING", "success");
    var bar = document.getElementById("pbar");
    if (bar) {
        bar.style.width = "100%";
    }
    setTimeout(function(){
        window.location.href = "index.html";
    }, 1500);
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e){
        setMsg("TRY AGIN...", "error");
    };
}
</script>

<<div class="container">
    <!-- Container Logo Tengah Atas -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo FANTAZIA" class="logo">
    </div>

    <div class="header-title">Webkit By FANTAZIA
    
    <div class="status-card">
        <!-- Teks default running berwarna putih -->
        <div id="msgs">FANTAZIA Instalasi Cache...</div>
        <div class="progress-container">
            <div id="pbar" class="progress-bar"></div>
        </div>
    </div>

    <div class="thanks-section">
        <h3>Special Thanks to:</h3>
        <div class="credits-list">
            <span class="credit-item">ENG/MOHAB ESAM</span>
            
        </div>
    </div>
</div>

<footer>
    <p>&copy; FANTAZIA Webkit Host</p>
</footer>

</body>
</html>
